name: CI Tests
run-name: "CI Tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# Migrated from .travis.yml, based on cwltool's ci-tests.yml.
# See .travis.yml in git history for previous changes and configurations.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  ci_tests:
    name: CI Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-ver-major: [ 3 ]
        py-ver-minor: [ 10, 11, 12, 13, 14 ]

    env:
      py-semver: ${{ format('{0}.{1}', matrix.py-ver-major, matrix.py-ver-minor) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.py-semver }}
          cache: pip
          cache-dependency-path: |
            **/setup.cfg

      - run: pip install -U pip setuptools wheel typing
      - run: pip install -e ".[all]"

      - run: make RUNNER=cwltool unittest-examples
